<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background circle glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="1"/>
    </radialGradient>

    <!-- Sun rays gradient -->
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Holy river water gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Arghya / Diya golden lamp gradient -->
    <linearGradient id="diyaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Deep Sacred Sky Circle Backdrop -->
  <circle cx="32" cy="32" r="30" fill="#7c2d12" stroke="#f59e0b" stroke-width="2"/>

  <!-- Sun Rays (12 radiating sacred rays) -->
  <g stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="12" />
    <line x1="45" y1="9.5" x2="41" y2="15" />
    <line x1="54.5" y1="19" x2="48.5" y2="23" />
    <line x1="58" y1="32" x2="52" y2="32" />
    <line x1="19" y1="9.5" x2="23" y2="15" />
    <line x1="9.5" y1="19" x2="15.5" y2="23" />
    <line x1="6" y1="32" x2="12" y2="32" />
  </g>

  <!-- Sacred Rising Sun (Dinanath) -->
  <circle cx="32" cy="29" r="14" fill="url(#sunGlow)"/>

  <!-- Holy Ganga Water Ripples (Arghya) -->
  <path d="M 4 43 Q 18 39 32 43 T 60 43 L 60 58 Q 46 62 32 62 Q 18 62 4 58 Z" fill="url(#waterGrad)"/>
  <path d="M 8 47 Q 20 44 32 47 T 56 47" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 12 52 Q 22 50 32 52 T 52 52" fill="none" stroke="#fed7aa" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating Sacred Puja Diya (Deepak) in Water -->
  <path d="M 24 45 Q 32 50 40 45 Q 32 46 24 45 Z" fill="url(#diyaGrad)" stroke="#78350f" stroke-width="0.75"/>
  <!-- Diya Flame -->
  <path d="M 32 38 Q 35 42 32 44 Q 29 42 32 38 Z" fill="#fff" opacity="0.95"/>
  <path d="M 32 37 Q 36 42 32 45 Q 28 42 32 37 Z" fill="#ef4444" opacity="0.45"/>
  <path d="M 32 39 Q 34 42 32 44 Q 30 42 32 39 Z" fill="#fbbf24"/>
</svg>
